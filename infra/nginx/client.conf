# nginx inside a client container: static files plus the single-page fallback.
# Routing between the clients and the API happens in the reverse proxy in front
# of these containers (see trefaro.conf).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This block MUST come before the hashed-asset block below: nginx takes the
    # first matching regex location, and `ngsw-worker.js` would otherwise be
    # served as an immutable asset — which would leave an installed PWA unable
    # to ever pick up a new version.
    location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Built asset names carry a content hash, so these can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|svg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes: /events/… is resolved by the application, not on disk.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
