# Trefaro — NGINX Reverse Proxy (Entwurf, gemäß Verteilungssicht der Thesis)
# Routen: /            -> Nutzer-Client
#         /admin       -> Veranstalter-Client
#         /api         -> NestJS-Server (REST)
#         /socket.io   -> NestJS-Server (WebSockets, Upgrade!)
# TLS (Let's Encrypt) wird beim Produktions-Setup ergänzt.

upstream user_client  { server user-client:80; }
upstream admin_client { server admin-client:80; }
upstream api_server   { server server:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;  # Datei-Uploads (Registrierungsanhänge, Bilder)

    location /api/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (socket.io) — Upgrade-Header sind Pflicht
    location /socket.io/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://admin_client/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://user_client;
        proxy_set_header Host $host;
    }
}
