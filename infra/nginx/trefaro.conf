# Trefaro reverse proxy — the fifth container of the distribution view.
#
# Routes:
#   /            -> participant client (mobile-first, installable PWA)
#   /admin/      -> organizer client (desktop-first)
#   /api/        -> NestJS server (REST, OpenAPI at /api/docs, plug-in bundles
#                   under /api/plugins)
#   /socket.io/  -> NestJS server (WebSockets — the Upgrade headers are what
#                   this block exists for)
#
# TLS is added when an instance is deployed: terminate Let's Encrypt here and
# redirect port 80 to 443. It is left out of the file so a local
# `docker compose up` works without certificates.

upstream user_client  { server user-client:80; }
upstream admin_client { server admin-client:80; }
upstream api_server   { server server:3000; }

server {
    listen 80;
    server_name _;

    # Registration attachments such as visa documents, plus logos and avatars.
    client_max_body_size 25m;

    # Redirects are emitted as relative paths. An absolute one would be built
    # from $host without the port, so /admin -> /admin/ would point at port 80
    # on any instance not published there — including the default compose port.
    absolute_redirect off;

    # The application is the only thing allowed to frame itself, and browsers
    # should not guess content types for uploaded files.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (socket.io). HTTP/1.1 and the Upgrade and Connection headers
    # are all required — without them the handshake fails and socket.io falls
    # back to long-polling, which looks like it works until a chat needs to push.
    # The long read timeout keeps an idle chat connection from being cut.
    location /socket.io/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The organizer client is built with base href /admin/, so it emits its own
    # asset URLs under that prefix. The trailing slash on proxy_pass strips the
    # prefix again before the request reaches the client container.
    location = /admin { return 301 /admin/; }

    location /admin/ {
        proxy_pass http://admin_client/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://user_client;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
