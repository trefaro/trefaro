# Trefaro reverse proxy — the fifth container of the distribution view.
#
# Plain HTTP. Good enough for `localhost`, and only for `localhost`: the
# administrative session cookie carries `Secure` in production (E2), and a
# browser stores such a cookie only over HTTPS — with the exception every browser
# makes for localhost. On a real host, add the TLS overlay:
#
#   docker compose --env-file .env -f infra/docker-compose.yml \
#                  -f infra/docker-compose.tls.yml up -d
#
# which replaces this file with `trefaro-tls.conf`. Both include the same
# `trefaro-locations.conf`, so the routing exists once.

upstream user_client  { server user-client:80; }
upstream admin_client { server admin-client:80; }
upstream api_server   { server server:3000; }

server {
    listen 80;
    server_name _;

    include /etc/nginx/trefaro-locations.conf;
}
