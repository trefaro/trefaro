# Trefaro reverse proxy with TLS (E29, NFR 15).
#
# Used by `infra/docker-compose.tls.yml`, which mounts this file in place of
# `trefaro.conf` together with a certificate and its key. The routing is not
# repeated here — it lives in `trefaro-locations.conf`, which both variants
# include.
#
# Getting a certificate stays outside the stack, on purpose: a certbot container
# would be a sixth service, a renewal schedule and a claim on port 80, and many
# organizations terminate TLS centrally anyway. The three ways that work:
#
#   1. Let's Encrypt on the host with `certbot --webroot -w <ACME_WEBROOT>`.
#      The `/.well-known/acme-challenge/` location below serves that directory,
#      so renewal needs no downtime.
#   2. A certificate the organization already has — point TLS_CERT_FILE and
#      TLS_KEY_FILE at the full chain and the private key.
#   3. A terminator in front of this stack. Then do not use this overlay at all:
#      run the plain one and make sure the terminator sets
#      `X-Forwarded-Proto: https`, which the server already trusts (one hop).

upstream user_client  { server user-client:80; }
upstream admin_client { server admin-client:80; }
upstream api_server   { server server:3000; }

server {
    listen 80;
    server_name _;

    # Before the redirect, so a renewal can answer over plain HTTP while
    # everything else is already on HTTPS. Empty and harmless when no webroot is
    # mounted.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Assumes the standard port pair (80 and 443 published as themselves). An
    # instance published on other ports should be reached through its HTTPS port
    # directly — a redirect cannot know the port it should name.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 as the floor: 1.0 and 1.1 are deprecated, and nothing that can run
    # a current browser needs them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Six months. A commitment, not a hardening flag: once a browser has seen
    # this header it will refuse plain HTTP for this host name until it expires,
    # so an instance that later has to be served without TLS is locked out of
    # that browser. That is the right trade for a site that carries a session
    # cookie and participant data — and it is one line to remove if an
    # organization needs the other trade.
    add_header Strict-Transport-Security "max-age=15552000" always;

    include /etc/nginx/trefaro-locations.conf;
}
