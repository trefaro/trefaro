# Trefaro — production stack, five containers as in the thesis' distribution view.
#
# One instance serves one organization; there is no multi-tenancy, by design.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# Run it from the repository root and pass --env-file explicitly: Compose
# otherwise looks for the .env file next to the compose file, in infra/.
#
# This file serves plain HTTP, which is enough for a trial run on localhost and
# nothing else: the session cookie carries `Secure` in production (E2). On a real
# host add the TLS overlay — `-f infra/docker-compose.tls.yml` — and see
# docs/INSTALL.md.
#
# Only the reverse proxy publishes a port. The server and the database are
# reachable on the internal network alone, so an unauthenticated endpoint can
# never be hit from outside.

name: trefaro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trefaro}
      POSTGRES_USER: ${DATABASE_USER:-trefaro}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-trefaro} -d ${DATABASE_NAME:-trefaro}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        # The server runs its migrations on boot, so it must not start before
        # the database accepts connections.
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-trefaro}
      DATABASE_USER: ${DATABASE_USER:-trefaro}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      PUBLIC_USER_CLIENT_URL: ${PUBLIC_USER_CLIENT_URL:?PUBLIC_USER_CLIENT_URL must be set}
      PUBLIC_ADMIN_CLIENT_URL: ${PUBLIC_ADMIN_CLIENT_URL:?PUBLIC_ADMIN_CLIENT_URL must be set}
      # The unattended way to create the first administrator (FR 1.2, FR 1.3).
      # Created only while `admin_user` is empty, so leaving both set is
      # harmless; remove them from the .env once a personal account exists.
      #
      # Leaving both empty is now a choice rather than a dead end: the server
      # then prints a setup token on startup and the organizer client offers the
      # guided first-run setup under /admin/setup (FR 1.1, E28).
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}

      # How much this instance writes: warn, log (the default here),
      # debug or verbose. `debug` adds a line for every 401 and every 404,
      # which is what you want while chasing something and not what you
      # want on a Tuesday. Quieter than `warn` is not offered — the lines
      # that say a limit was raised or that mail leaves unencrypted are
      # warnings, and an instance that cannot print them cannot be checked
      # from its own log. Docker keeps what the container writes; `docker
      # compose logs -f server` reads it.
      LOG_LEVEL: ${LOG_LEVEL:-}

      # What this instance refuses to do too often (E60). Left empty on purpose:
      # the defaults live in the server, so writing them here too would be two
      # numbers waiting to disagree. Set one in the .env only with a reason —
      # an office behind a single public address is the usual one. The server
      # logs every raised value while starting, because a raised limit is a
      # limit nobody is testing any more (E4).
      # The budget every request counts against, per client address per
      # minute — the socket.io handshake included. Raising it is what a load
      # test needs (NFR 12) and not what an instance needs; put it back
      # afterwards.
      GLOBAL_REQUESTS_PER_MINUTE: ${GLOBAL_REQUESTS_PER_MINUTE:-}
      LOGIN_ATTEMPTS_PER_WINDOW: ${LOGIN_ATTEMPTS_PER_WINDOW:-}
      REGISTRATIONS_PER_WINDOW: ${REGISTRATIONS_PER_WINDOW:-}
      NEWSLETTER_SIGNUPS_PER_WINDOW: ${NEWSLETTER_SIGNUPS_PER_WINDOW:-}
      CONFIRMATIONS_PER_WINDOW: ${CONFIRMATIONS_PER_WINDOW:-}
      PASSWORD_RESETS_PER_WINDOW: ${PASSWORD_RESETS_PER_WINDOW:-}
      MAILS_PER_RECIPIENT_PER_WINDOW: ${MAILS_PER_RECIPIENT_PER_WINDOW:-}
      # RATE_LIMIT_PROFILE is deliberately not passed through: a profile is a
      # thing a test run loads from a file, never something an instance ships
      # (E61). An operator who wants different numbers sets the numbers.
      # DATABASE_SYNCHRONIZE is deliberately not passed through: migrations are
      # the only authority over the schema, and the server refuses to start with
      # it on in production anyway. UPLOAD_DIR, PLUGIN_BUNDLE_DIR and
      # I18N_CATALOGUE_DIR belong to the image (see
      # infra/docker/server.Dockerfile) and not to the operator.

      # The organization's own mail server (no third-party mail service).
      #
      # Port 587 is submission, which starts unencrypted and *upgrades* — so
      # SMTP_SECURE stays off there and SMTP_REQUIRE_TLS is what makes the
      # upgrade non-negotiable (E62). Implicit TLS is port 465: then set
      # SMTP_SECURE=true and the port, and REQUIRE_TLS has nothing left to do.
      # Neither is left to chance: the server requires encryption in production
      # unless the .env says otherwise, and says so out loud while starting.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # How long the invitation sender waits between two messages. Empty means
      # the shipped second; raise it if the mail service says so, and never
      # lower it without a reason — the server logs a shortened pause.
      SMTP_PAUSE_BETWEEN_MAILS_MS: ${SMTP_PAUSE_BETWEEN_MAILS_MS:-}
      # A mail server whose certificate no public authority vouches for — an
      # internal one, one behind the organization's own CA — is trusted by
      # naming its certificate here, and in no other way (E62). Put the file in
      # the directory mounted below and point this at it, e.g.
      # NODE_EXTRA_CA_CERTS=/etc/trefaro/ca/mail.pem. There is no setting
      # anywhere that turns the check off, and there will not be one.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Self-hosted Web Push. Leave both empty to run without push.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      # Uploaded files: logos, avatars, registration attachments. Backing this
      # volume up is part of backing up the instance.
      - uploads:/app/uploads
      # Certificates the image does not ship with — see NODE_EXTRA_CA_CERTS
      # above. Empty in a normal deployment, and mounted either way so that
      # trusting an internal mail server is a file and a variable rather than a
      # second compose file.
      - ${SMTP_CA_DIR:-./ca}:/etc/trefaro/ca:ro

  user-client:
    build:
      context: ..
      dockerfile: infra/docker/client.Dockerfile
      args:
        APP: user-client
        BASE_HREF: /
    restart: unless-stopped

  admin-client:
    build:
      context: ..
      dockerfile: infra/docker/client.Dockerfile
      args:
        APP: admin-client
        # Served under /admin/, which Angular needs at build time.
        BASE_HREF: /admin/
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - server
      - user-client
      - admin-client
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/trefaro.conf:/etc/nginx/conf.d/default.conf:ro
      # The routing itself, included by both variants of the server block —
      # this one and the TLS overlay's (E29).
      - ./nginx/trefaro-locations.conf:/etc/nginx/trefaro-locations.conf:ro

volumes:
  pgdata:
  uploads:
