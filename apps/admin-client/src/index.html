<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trefaro Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Inline, so it needs no stylesheet of its own to be visible. */
      .trefaro-booting {
        display: grid;
        place-items: center;
        min-block-size: 100vh;
        font-family: system-ui, sans-serif;
        color: #444;
      }
    </style>
  </head>
  <body>
    <trefaro-root>
      <!-- Replaced as soon as Angular bootstraps. It is here because startup
           waits for the server's configuration, and a slow or unreachable
           instance would otherwise show an empty page for seconds (NFR 10). -->
      <div class="trefaro-booting" role="status">Loading Trefaro…</div>
    </trefaro-root>
  </body>
</html>
