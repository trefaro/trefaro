@if (auth.isLoggedIn()) {
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar__brand">
      @if (theme.hasLogo()) {
      <!-- Decorative: the name stands right beside it, so a screen reader that
           announced the logo too would read the organization twice. -->
      <span class="sidebar__logo" aria-hidden="true"></span>
      }
      <span class="sidebar__title">{{ config.organizationName() }}</span>
    </div>

    <nav class="sidebar__nav" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Event series
      </a>
      <a routerLink="/administrators" routerLinkActive="is-active">
        Administrators
      </a>
      <a routerLink="/design" routerLinkActive="is-active">Design</a>
      <a routerLink="/modules" routerLinkActive="is-active">Modules</a>
      <!-- Plug-in hook point one: the navigation bar. -->
      <trefaro-plugin-slot mountPoint="navigation" />
    </nav>

    <div class="sidebar__account">
      <!-- Above the account, not in the navigation: choosing a language is not
           a place in the application. -->
      <trefaro-language-switcher />
      <span class="sidebar__account-name">{{ auth.admin()?.name }}</span>
      <button type="button" class="sidebar__signout" (click)="signOut()">
        Sign out
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
} @else {
<router-outlet />
}
