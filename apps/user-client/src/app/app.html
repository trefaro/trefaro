<!-- Above everything, including the header: when there is no network, that is
     the first thing to say about the page (F20). -->
<trefaro-offline-banner />

<header class="app-header">
  <!-- The navigation itself, as the mockups draw it: a hamburger here and a
       drawer over the page (AP 7 of phase 5). -->
  <trefaro-nav-drawer />
  @if (theme.hasLogo()) {
  <!-- Decorative: the organization's name is the link right next to it, and
       announcing both would read the same thing twice. -->
  <span class="app-header__logo" aria-hidden="true"></span>
  }
  <a class="app-header__title" routerLink="/"
    >{{ config.organizationName() }}</a
  >
  <!-- In the header rather than in the drawer: a language is chosen before the
       interface is understood, and behind a hamburger it is not. Compact,
       because at 390 pixels this row already carries the hamburger, the logo
       and the organization's name — the written word goes, the accessible
       name stays. -->
  <trefaro-language-switcher [compact]="true" />
</header>

<main class="app-main">
  <router-outlet />
</main>

<!-- After the content, never in front of it: somebody who followed a link to an
     event came for the event. The same applies to the offer of notifications,
     which is here for the same reason the installation hint is: neither belongs
     to a screen, and both have to be reachable for somebody with no account
     (E43). -->
<trefaro-install-hint />
<trefaro-notification-offer />
