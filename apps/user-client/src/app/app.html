<header class="app-header">
  @if (theme.hasLogo()) {
  <!-- Decorative: the organization's name is the link right next to it, and
       announcing both would read the same thing twice. -->
  <span class="app-header__logo" aria-hidden="true"></span>
  }
  <a class="app-header__title" routerLink="/"
    >{{ config.organizationName() }}</a
  >
</header>

<main class="app-main">
  <router-outlet />
</main>

<nav class="app-nav" aria-label="Main navigation">
  <a class="app-nav__link" routerLink="/">Event series</a>
  <!-- Plug-in hook point one: the navigation bar. -->
  <trefaro-plugin-slot mountPoint="navigation" />
</nav>
