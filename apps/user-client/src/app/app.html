<!-- Above everything, including the header: when there is no network, that is
     the first thing to say about the page (F20). -->
<trefaro-offline-banner />

<header class="app-header">
  @if (theme.hasLogo()) {
  <!-- Decorative: the organization's name is the link right next to it, and
       announcing both would read the same thing twice. -->
  <span class="app-header__logo" aria-hidden="true"></span>
  }
  <a class="app-header__title" routerLink="/"
    >{{ config.organizationName() }}</a
  >
  <!-- In the header rather than in the bottom navigation: that bar is where a
       participant goes somewhere, and a language is not a somewhere. -->
  <trefaro-language-switcher />
</header>

<main class="app-main">
  <router-outlet />
</main>

<!-- After the content, never in front of it: somebody who followed a link to an
     event came for the event. -->
<trefaro-install-hint />

<nav class="app-nav" [attr.aria-label]="'app.nav.label' | transloco">
  <a class="app-nav__link" routerLink="/">{{ 'app.nav.series' | transloco }}</a>
  <!-- Plug-in hook point one: the navigation bar. -->
  <trefaro-plugin-slot mountPoint="navigation" />
</nav>
