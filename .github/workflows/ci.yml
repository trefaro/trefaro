# Trefaro CI
#
# Three jobs, in increasing cost and decreasing frequency of failure:
#
#   quality  — format, lint, unit tests and builds for the affected projects
#   e2e      — both clients in a real browser against a real server and database
#   images   — the five-container stack's images
#
# The image job exists because phase 0 found two defects that no unit test could
# have caught: a database driver missing from the server image's dependency list,
# and a service worker served as an immutable asset. Both only appear once
# something is actually built into a container.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node LTS, matching the version the container images are built on.
  NODE_VERSION: '24'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx needs history to work out what changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx format:check
      - run: npx nx affected -t lint --parallel=3
      - run: npx nx affected -t test --parallel=3
      - run: npx nx affected -t build --parallel=3

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trefaro
          POSTGRES_USER: trefaro
          POSTGRES_PASSWORD: trefaro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trefaro -d trefaro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The server applies its migrations on startup against this database.
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_NAME: trefaro
      DATABASE_USER: trefaro
      DATABASE_PASSWORD: trefaro_ci
      # Where the plug-in web component bundles are served from, so the
      # participant client can load them.
      PLUGIN_BUNDLE_DIR: ./dist/apps/plugins
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Chromium plus WebKit: WebKit is the engine behind the iOS case the PWA
      # and Web Push decisions depend on, so it is not optional here.
      - run: npx playwright install --with-deps chromium webkit

      # Playwright starts the server and the client itself, but the plug-in
      # bundle has to exist first — one of the tests asserts it is served.
      - run: npx nx build plugin-room-planning
      - run: npx nx run-many -t e2e --parallel=1

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/*-e2e/playwright-report
            apps/*-e2e/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: infra/docker/server.Dockerfile
            args: ''
          - name: user-client
            dockerfile: infra/docker/client.Dockerfile
            args: |
              APP=user-client
              BASE_HREF=/
          - name: admin-client
            dockerfile: infra/docker/client.Dockerfile
            args: |
              APP=admin-client
              BASE_HREF=/admin/
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          # Built, not published: release images are a phase 5 concern.
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
